name: Release

# Runs when a vX.Y.Z tag is pushed, or when main is pushed with a VERSION that has no tag yet
# (the workflow then creates the tag itself).
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: v
        run: |
          v="$(cat VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != VERSION $v"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v already released – nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.v.outputs.release == 'true'
        with:
          python-version: "3.13"
      - name: Run tests
        if: steps.v.outputs.release == 'true'
        run: |
          pip install -r backend/requirements-dev.txt
          cd backend && python -m pytest -q

      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.release == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.release == 'true'
      - uses: docker/login-action@v3
        if: steps.v.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.v.outputs.release == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/photosorter2claude
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.v.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        if: steps.v.outputs.release == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release notes from CHANGELOG
        if: steps.v.outputs.release == 'true'
        run: |
          v="$(cat VERSION)"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} /^## / && p {exit} p' CHANGELOG.md > notes.md
          {
            echo ""
            echo "### Deploy"
            echo "Image: \`ghcr.io/${{ github.repository_owner }}/photosorter2claude:${v}\`"
            echo "Use the attached \`docker-compose.yaml\` (set \`PHOTOSORTER_TAG=${v}\` to pin this version)."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.release == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PhotoSorter2Claude v${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            docker-compose.yaml
            .env.example
            config/config.example.yaml
            docs/PhotoSorter2Claude-Documentation.pdf
